<!doctype html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#0b0b0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>濱景花園3座｜360° VR</title>
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="app">
  <aside id="side" aria-label="位置選單">
    <div class="head">
      <h1>濱景花園 3座</h1>
      <p>360° VR｜全畫質動態分塊</p>
    </div>
    <div id="rooms"></div>
  </aside>

  <main id="main">
    <div id="viewer" aria-label="360 VR viewer">
      <canvas id="glcanvas"></canvas>
      <div id="transitionShade"></div>
      <div id="hotspots" aria-live="polite"></div>
    </div>

    <div id="topbar">
      <select id="mobileRooms" aria-label="選擇位置"></select>
      <div id="title">載入中…</div>
      <span id="quality" class="badge">2048 原畫質 · 動態分塊</span>
      <button class="ctrl icon" id="zoomOut" type="button" title="縮小" aria-label="縮小">−</button>
      <button class="ctrl icon" id="zoomIn" type="button" title="放大" aria-label="放大">＋</button>
      <button class="ctrl txt" id="reset" type="button">重設視角</button>
      <button class="ctrl txt active" id="walkMode" type="button">門口導航</button>
      <button class="ctrl txt" id="photoMode" type="button">六面相片</button>
      <button class="ctrl icon" id="full" type="button" title="全螢幕" aria-label="全螢幕">⛶</button>
    </div>

    <div id="walkDock" aria-label="相鄰位置"></div>
    <div id="walkMsg" role="status"></div>
    <div id="hint">拖曳四周觀看 · 點擊門口進入房間 · 雙指縮放</div>

    <section id="photoPanel" aria-hidden="true">
      <div class="photoTop">
        <div>
          <strong id="photoTitle"></strong>
          <span>原始 2048×2048 六面相片</span>
        </div>
        <button class="ctrl" id="photoClose" type="button">← 返回 VR</button>
      </div>
      <div class="photoStage"><img id="photoImage" alt="原始六面相片"></div>
      <div id="photoTabs" class="photoTabs"></div>
    </section>

    <div id="loading" class="loading show" role="status">
      <div class="spinner"></div>
      <div id="loadingText">正在載入全景…</div>
    </div>

    <div id="fatal" role="alert">
      <div class="fatalBox">
        <h2>這個瀏覽器暫時無法顯示 3D VR</h2>
        <p id="fatalText">請嘗試更新瀏覽器，或確認硬件加速 / WebGL 已啟用。</p>
        <button class="ctrl" id="fatalPhotos" type="button">查看原始六面相片</button>
      </div>
    </div>

    <div id="debugPanel" hidden></div>
  </main>
</div>
<script type="module" src="assets/app.js"></script>
</body>
</html>
